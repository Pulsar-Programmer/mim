name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable version
        if: github.ref_type == 'tag'
        run: |
          version=$(jq -er '.version' src-tauri/tauri.conf.json)
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(jq -er '.version' package.json)" = "$version"
          test "$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml)" = "$version"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the notarized app for stapler validation after DMG creation.
          - { runner: macos-15, target: aarch64-apple-darwin, bundles: 'app,dmg' }
          - { runner: macos-15, target: x86_64-apple-darwin, bundles: 'app,dmg' }
          - { runner: windows-2025, target: x86_64-pc-windows-msvc, bundles: nsis }
          - { runner: windows-2025, target: aarch64-pc-windows-msvc, bundles: nsis }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundles: 'deb,appimage' }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, bundles: 'deb,appimage' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64 xdg-utils
      - run: bun install --frozen-lockfile
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag || -n "$APPLE_CERTIFICATE" ]]; then
            : "${APPLE_CERTIFICATE:?Missing APPLE_CERTIFICATE}"
            : "${APPLE_CERTIFICATE_PASSWORD:?Missing APPLE_CERTIFICATE_PASSWORD}"
            : "${APPLE_SIGNING_IDENTITY:?Missing APPLE_SIGNING_IDENTITY}"
            : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY}"
            : "${APPLE_API_KEY:?Missing APPLE_API_KEY_ID}"
            : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER}"
            umask 077
            APPLE_API_KEY_PATH="$(mktemp "$RUNNER_TEMP/apple-notary.XXXXXX")"
            printf '%s' "$APPLE_API_KEY_BASE64" | openssl base64 -d -A > "$APPLE_API_KEY_PATH"
            openssl pkey -in "$APPLE_API_KEY_PATH" -noout
            jq 'del(.bundle.macOS.signingIdentity)' src-tauri/tauri.conf.json > "$RUNNER_TEMP/tauri.conf.json"
            mv "$RUNNER_TEMP/tauri.conf.json" src-tauri/tauri.conf.json
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH; do
              printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
            done
          fi
      - uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify notarization
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        run: xcrun stapler validate "src-tauri/target/${{ matrix.target }}/release/bundle/macos/MIM.app"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' installers < <(find installers -type f -print0)
          test "${#installers[@]}" -eq 8
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release.json; then
            jq -e '.isDraft' release.json
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes --title "MIM ${GITHUB_REF_NAME#v}"
          fi
          gh release upload "$GITHUB_REF_NAME" "${installers[@]}" --clobber
